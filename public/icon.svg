<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Inner Circle with Dark Contrast -->
  <circle cx="256" cy="256" r="190" fill="#090514" fill-opacity="0.75" />

  <!-- Crown Icon (Joshi Ji Reels Royal Emblem) -->
  <path d="M128 340 L152 200 L216 270 L256 160 L296 270 L360 200 L384 340 Z" fill="url(#crownGrad)" filter="url(#glow)" />
  <circle cx="152" cy="190" r="14" fill="#fef08a" />
  <circle cx="256" cy="150" r="18" fill="#fef08a" />
  <circle cx="360" cy="190" r="14" fill="#fef08a" />

  <!-- Base Crown Band -->
  <rect x="128" y="340" width="256" height="36" rx="18" fill="#fbbf24" />
  <circle cx="180" cy="358" r="8" fill="#ea580c" />
  <circle cx="256" cy="358" r="8" fill="#7c3aed" />
  <circle cx="332" cy="358" r="8" fill="#ea580c" />

  <!-- Play Reel Triangle Indicator -->
  <polygon points="244,240 284,264 244,288" fill="#ffffff" opacity="0.9" />

  <!-- Text -->
  <text x="256" y="440" font-family="'Poppins', 'Arial', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    JOSHI JI
  </text>
  <text x="256" y="478" font-family="'Poppins', 'Arial', sans-serif" font-size="24" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="4">
    REELS
  </text>
</svg>
