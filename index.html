<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Joshi Ji Reels</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:28px;width:100%;max-width:380px;text-align:center}h1{font-size:28px;color:#ff0050;margin-bottom:8px}.sub{color:#aaa;font-size:14px;margin-bottom:24px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:16px;margin-bottom:12px}button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff0050,#ff7a00);color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}.msg{margin-top:16px;font-size:13px}.success{color:#00ff88}.error{color:#ff4444}</style></head><body><div class="card"><h1>Joshi Ji Reels 👑</h1><div class="sub">1 Mobile = 1 Account | Real OTP</div><div id="step1"><input type="tel" id="phone" placeholder="+91XXXXXXXXXX"/><div id="recaptcha-container"></div><button id="sendBtn" onclick="sendOTP()">OTP भेजें</button></div><div id="step2" style="display:none"><input type="text" id="otp" placeholder="6 Digit OTP" maxlength="6"/><button onclick="verifyOTP()">Verify & Login</button><button style="background:#222;margin-top:10px" onclick="location.reload()">Back</button></div><div id="msg" class="msg"></div><div style="margin-top:15px;font-size:11px;color:#666">Duplicate Account Auto Blocked 🔒</div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getAuth,RecaptchaVerifier,signInWithPhoneNumber}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp,query,collection,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"123456",appId:"1:..."};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);let confirmationResult=null;let recaptchaVerifier=null;window.onload=()=>{recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});recaptchaVerifier.render();};window.sendOTP=async()=>{const phone=document.getElementById('phone').value.trim();const msg=document.getElementById('msg');if(!phone.startsWith('+')){msg.innerHTML='<span class=error>+91 के साथ डालें: +91XXXXXXXXXX</span>';return;}msg.innerHTML='Checking...';try{const q=query(collection(db,"users"),where("phone","==",phone));const snap=await getDocs(q);if(!snap.empty){msg.innerHTML='<span class=success>Account पहले से है - Login होगा 👑</span>';}confirmationResult=await signInWithPhoneNumber(auth,phone,recaptchaVerifier);document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';msg.innerHTML='<span class=success>OTP भेज दिया ✅</span>';}catch(e){msg.innerHTML='<span class=error>'+e.message+'</span>';}};window.verifyOTP=async()=>{const code=document.getElementById('otp').value.trim();const phone=document.getElementById('phone').value.trim();const msg=document.getElementById('msg');try{const result=await confirmationResult.confirm(code);const user=result.user;const q=query(collection(db,"users"),where("phone","==",phone));const snap=await getDocs(q);let phoneExists=false;snap.forEach(d=>{if(d.id!==user.uid)phoneExists=true;});if(phoneExists){msg.innerHTML='<span class=error>❌ Duplicate Blocked! Account पहले से है!</span>';}else{const userRef=doc(db,"users",user.uid);const existing=await getDoc(userRef);if(!existing.exists()){await setDoc(userRef,{phone:phone,uid:user.uid,createdAt:serverTimestamp()});msg.innerHTML='<span class=success>🎉 Account बन गया!</span>';}else{msg.innerHTML='<span class=success>✅ Login Successful!</span>';}}setTimeout(()=>{window.location.href="/";},1200);}catch(e){msg.innerHTML='<span class=error>गलत OTP</span>';}};</script></body></html>
